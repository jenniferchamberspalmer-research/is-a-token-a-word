name: Operator probe

# Phone-friendly runner for probes/operator_probe (see HANDOFF.md there).
# Start it from the Actions tab: pick a stage and a branch. Each stage runs
# on Modal (L4 GPU for model stages) and commits its outputs back to the
# chosen branch. The workflow file lives on main only so that GitHub shows
# the Run button; the probe code is always checked out from the chosen branch.
#
# Stages, in order:
#   revisions       Hub revision hashes + surface-form tokenization only.
#                   Reads no corpus text. Writes runs/R1/revisions.json.
#   pull-calibrate  Corpus download, sampling, pilot window calibration.
#                   Commits the pull log and calibration results (Commit 2).
#   capture-render  Main/control/baseline capture at the fixed window, then
#                   readouts and films (Commit 3). Needs fixed_window set.
#
# Required repository secrets: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET.
# Required on Modal (from the Water Pattern setup): secret "huggingface".

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        required: true
        type: choice
        options: [revisions, pull-calibrate, capture-render]
      branch:
        description: Branch holding the probe code
        required: true
        default: claude/operator-probe

permissions:
  contents: write

concurrency:
  group: operator-probe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client dependencies
        run: pip install --quiet modal pyyaml numpy matplotlib

      - name: Check Modal credentials
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository secrets."
            exit 1
          fi

      - name: revisions
        if: inputs.stage == 'revisions'
        run: modal run probes/operator_probe/modal_run.py::revisions

      - name: pull
        if: inputs.stage == 'pull-calibrate'
        run: modal run probes/operator_probe/modal_run.py::pull

      - name: calibrate
        if: inputs.stage == 'pull-calibrate'
        run: modal run probes/operator_probe/modal_run.py::calibrate

      - name: capture
        if: inputs.stage == 'capture-render'
        run: modal run probes/operator_probe/modal_run.py::capture

      - name: render
        if: inputs.stage == 'capture-render'
        run: modal run probes/operator_probe/modal_run.py::render

      - name: Commit outputs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probes/operator_probe/runs/ || true
          if git diff --cached --quiet; then
            echo "No outputs to commit."
          else
            git commit -m "Operator probe: ${{ inputs.stage }} outputs (workflow run #${{ github.run_number }}, status ${{ job.status }})"
            git push origin HEAD:${{ inputs.branch }}
          fi
